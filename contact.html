<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="contact" class="contact-section py-20">
  <div class="max-w-4xl mx-auto px-6 text-center">
    
    <h2 class="text-4xl font-semibold mb-4 contact-title">
      Liên hệ với chúng tôi
    </h2>

    <p class="mb-10 text-gray-500">
      Hãy để lại thông tin, chúng tôi sẽ liên hệ sớm nhất!
    </p>

    <form class="space-y-5">
      
      <input 
        type="text" 
        placeholder="Tên của bạn"
        class="contact-input"
      />
      
      <input 
        type="email" 
        placeholder="Email"
        class="contact-input"
      />
      
      <textarea 
        placeholder="Nội dung..."
        class="contact-input h-32"
      ></textarea>

      <button type="submit" class="contact-btn">
        Gửi liên hệ
      </button>

    </form>
  </div>
</section>
</body>
</html>
